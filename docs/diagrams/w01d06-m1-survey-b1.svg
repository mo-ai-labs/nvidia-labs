<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 615" width="860" height="615" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs></defs><rect x="-30" y="-30" width="860" height="615" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">Five ways an LLM agent plans</text><text x="0" y="48" font-size="16" fill="#757575" font-weight="600">Survey taxonomy, Figure 1 (arXiv 2402.02716)</text><rect x="0" y="65" width="220" height="70" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="95.05" font-size="18" text-anchor="middle" fill="#1e1e1e">Task</text><text x="110.0" y="117.55" font-size="18" text-anchor="middle" fill="#1e1e1e">decomposition</text><rect x="240" y="65" width="530" height="70" rx="12" fill="none" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Divide and conquer: split into sub-tasks</text><text x="505.0" y="115.6" font-size="16" text-anchor="middle" fill="#1e1e1e">e.g. CoT, ReAct, Plan-and-Solve, HuggingGPT</text><rect x="0" y="150" width="220" height="70" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="180.05" font-size="18" text-anchor="middle" fill="#1e1e1e">Multi-plan</text><text x="110.0" y="202.55" font-size="18" text-anchor="middle" fill="#1e1e1e">selection</text><rect x="240" y="150" width="530" height="70" rx="12" fill="none" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="180.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Generate several plans, then pick the best one</text><text x="505.0" y="200.6" font-size="16" text-anchor="middle" fill="#1e1e1e">e.g. Tree-of-Thoughts, CoT-SC, LLM-MCTS</text><rect x="0" y="235" width="220" height="70" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="265.05" font-size="18" text-anchor="middle" fill="#1e1e1e">External</text><text x="110.0" y="287.55" font-size="18" text-anchor="middle" fill="#1e1e1e">planner-aided</text><rect x="240" y="235" width="530" height="70" rx="12" fill="none" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="265.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM translates the task; a classic solver plans it</text><text x="505.0" y="285.6" font-size="16" text-anchor="middle" fill="#1e1e1e">e.g. LLM+P (PDDL planner), LLM+ASP</text><rect x="0" y="320" width="220" height="70" rx="12" fill="#ffc9c9" fill-opacity="1.0" stroke="#ef4444" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="350.05" font-size="18" text-anchor="middle" fill="#1e1e1e">Reflection and</text><text x="110.0" y="372.55" font-size="18" text-anchor="middle" fill="#1e1e1e">refinement</text><rect x="240" y="320" width="530" height="70" rx="12" fill="none" fill-opacity="1.0" stroke="#ef4444" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="350.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Reflect on a failure, then fix the plan and retry</text><text x="505.0" y="370.6" font-size="16" text-anchor="middle" fill="#1e1e1e">e.g. Reflexion, Self-Refine, CRITIC</text><rect x="0" y="405" width="220" height="70" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="435.05" font-size="18" text-anchor="middle" fill="#1e1e1e">Memory-</text><text x="110.0" y="457.55" font-size="18" text-anchor="middle" fill="#1e1e1e">augmented</text><rect x="240" y="405" width="530" height="70" rx="12" fill="none" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="435.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Store useful past experience, retrieve it to plan</text><text x="505.0" y="455.6" font-size="16" text-anchor="middle" fill="#1e1e1e">e.g. Generative Agents, MemGPT, MemoryBank</text><rect x="0" y="495" width="770" height="60" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="530.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Categories mix: Reflexion = reflection + memory. Today you build only the first one.</text></svg>