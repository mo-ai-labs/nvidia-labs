<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, sans-serif"><rect width="800" height="600" fill="#fff"/>
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#555"/></marker></defs>
<text x="400.0" y="40" font-size="22" text-anchor="middle" font-weight="600">Prompt chaining: each call processes the last one&#x27;s output</text>
<rect x="30" y="120" width="130" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="95.0" y="160.0" font-size="15" text-anchor="middle">Alert text</text>
<rect x="200" y="110" width="160" height="90" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text x="280.0" y="150.0" font-size="15" text-anchor="middle">LLM call 1</text>
<text x="280.0" y="170.0" font-size="15" text-anchor="middle">TRIAGE</text>
<rect x="420" y="110" width="160" height="90" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text x="500.0" y="150.0" font-size="15" text-anchor="middle">LLM call 2</text>
<text x="500.0" y="170.0" font-size="15" text-anchor="middle">EXTRACT</text>
<rect x="660" y="105" width="130" height="100" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="725.0" y="140.0" font-size="15" text-anchor="middle">GATE</text>
<text x="725.0" y="160.0" font-size="15" text-anchor="middle">sum(amounts)</text>
<text x="725.0" y="180.0" font-size="15" text-anchor="middle">== total?</text>
<rect x="140" y="260" width="160" height="90" rx="10" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2"/>
<text x="220.0" y="300.0" font-size="15" text-anchor="middle">LLM call 3</text>
<text x="220.0" y="320.0" font-size="15" text-anchor="middle">SUMMARISE</text>
<rect x="120" y="400" width="200" height="70" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="220.0" y="430.0" font-size="15" text-anchor="middle">2-sentence summary</text>
<text x="220.0" y="450.0" font-size="15" text-anchor="middle">for an investigator</text>
<rect x="450" y="420" width="180" height="70" rx="10" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="540.0" y="450.0" font-size="15" text-anchor="middle">STOP: no summary</text>
<text x="540.0" y="470.0" font-size="15" text-anchor="middle">numbers don&#x27;t add up</text>
<polyline points="160,155 196,155" fill="none" stroke="#555" stroke-width="2"  marker-end="url(#h)"/>
<polyline points="360,155 416,155" fill="none" stroke="#555" stroke-width="2"  marker-end="url(#h)"/>
<text x="388.0" y="147.0" font-size="14" text-anchor="middle" fill="#555">label</text>
<polyline points="580,155 656,155" fill="none" stroke="#555" stroke-width="2"  marker-end="url(#h)"/>
<text x="618.0" y="147.0" font-size="14" text-anchor="middle" fill="#555">facts</text>
<polyline points="725,205 725,305 304,305" fill="none" stroke="#22c55e" stroke-width="2"  marker-end="url(#h)"/>
<text x="584.6666666666666" y="263.6666666666667" font-size="14" text-anchor="middle" fill="#22c55e">pass</text>
<polyline points="220,350 220,396" fill="none" stroke="#555" stroke-width="2"  marker-end="url(#h)"/>
<polyline points="790,155 790,455 634,455" fill="none" stroke="#ef4444" stroke-width="2"  marker-end="url(#h)"/>
<text x="738.0" y="347.0" font-size="14" text-anchor="middle" fill="#ef4444">fail</text>
<text x="30" y="530" font-size="16" fill="#b45309">The gate is plain Python (no LLM call): abs(sum(facts.amounts) - facts.total) &gt; 0.01</text>
</svg>