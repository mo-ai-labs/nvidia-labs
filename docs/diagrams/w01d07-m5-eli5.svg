<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, sans-serif"><rect width="800" height="600" fill="#fff"/>
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#555"/></marker></defs>
<text x="400.0" y="40" font-size="22" text-anchor="middle" font-weight="600">Three ways to think harder (no tools)</text>
<rect x="30" y="70" width="230" height="480" rx="10" fill="#fff9db" stroke="#f59e0b" stroke-width="2"/>
<text x="145.0" y="225.0" font-size="15" text-anchor="middle">1. Chain-of-thought</text>
<text x="145.0" y="245.0" font-size="15" text-anchor="middle"></text>
<text x="145.0" y="265.0" font-size="15" text-anchor="middle">&#x27;Show your work&#x27;</text>
<text x="145.0" y="285.0" font-size="15" text-anchor="middle"></text>
<text x="145.0" y="305.0" font-size="15" text-anchor="middle">One kid solves the sum</text>
<text x="145.0" y="325.0" font-size="15" text-anchor="middle">on paper, step by step,</text>
<text x="145.0" y="345.0" font-size="15" text-anchor="middle">then writes the answer.</text>
<text x="145.0" y="365.0" font-size="15" text-anchor="middle"></text>
<text x="145.0" y="385.0" font-size="15" text-anchor="middle">One try. If step 2 is</text>
<text x="145.0" y="405.0" font-size="15" text-anchor="middle">wrong, the answer is wrong.</text>
<rect x="285" y="70" width="230" height="480" rx="10" fill="#ebfbee" stroke="#22c55e" stroke-width="2"/>
<text x="400.0" y="225.0" font-size="15" text-anchor="middle">2. Self-consistency</text>
<text x="400.0" y="245.0" font-size="15" text-anchor="middle"></text>
<text x="400.0" y="265.0" font-size="15" text-anchor="middle">&#x27;Ask 5 kids&#x27;</text>
<text x="400.0" y="285.0" font-size="15" text-anchor="middle"></text>
<text x="400.0" y="305.0" font-size="15" text-anchor="middle">Five kids each show</text>
<text x="400.0" y="325.0" font-size="15" text-anchor="middle">their work separately.</text>
<text x="400.0" y="345.0" font-size="15" text-anchor="middle">Take the answer most got.</text>
<text x="400.0" y="365.0" font-size="15" text-anchor="middle"></text>
<text x="400.0" y="385.0" font-size="15" text-anchor="middle">One slip gets outvoted.</text>
<text x="400.0" y="405.0" font-size="15" text-anchor="middle">5 kids = 5x the effort.</text>
<rect x="540" y="70" width="230" height="480" rx="10" fill="#f3f0ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="655.0" y="225.0" font-size="15" text-anchor="middle">3. Tree-of-thoughts</text>
<text x="655.0" y="245.0" font-size="15" text-anchor="middle"></text>
<text x="655.0" y="265.0" font-size="15" text-anchor="middle">&#x27;Solve a maze&#x27;</text>
<text x="655.0" y="285.0" font-size="15" text-anchor="middle"></text>
<text x="655.0" y="305.0" font-size="15" text-anchor="middle">At each fork, try a few</text>
<text x="655.0" y="325.0" font-size="15" text-anchor="middle">ways, judge which looks best.</text>
<text x="655.0" y="345.0" font-size="15" text-anchor="middle">Dead end? Go back</text>
<text x="655.0" y="365.0" font-size="15" text-anchor="middle">and try another.</text>
<text x="655.0" y="385.0" font-size="15" text-anchor="middle"></text>
<text x="655.0" y="405.0" font-size="15" text-anchor="middle">Smartest, but slowest.</text>
</svg>