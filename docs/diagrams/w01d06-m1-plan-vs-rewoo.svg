<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 630" width="860" height="630" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m1e1e1e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker></defs><rect x="-30" y="-30" width="860" height="630" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">Who handles step 2, &quot;sum A-1002&quot;?</text><text x="0" y="70" font-size="20" fill="#2563eb" font-weight="600">Plan-and-execute</text><text x="400" y="70" font-size="20" fill="#15803d" font-weight="600">ReWOO</text><rect x="0" y="90" width="370" height="70" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="120.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Plan step, plain English:</text><text x="185.0" y="140.6" font-size="16" text-anchor="middle" fill="#1e1e1e">&quot;sum the amounts of A-1002&quot;</text><rect x="400" y="90" width="370" height="70" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="120.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Plan step, already executable:</text><text x="585.0" y="140.6" font-size="16" text-anchor="middle" fill="#1e1e1e">#E4 = calculator[#E2 amounts]</text><polyline points="185,160 185,190" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polyline points="585,160 585,190" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="190" width="370" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="220.6" font-size="16" text-anchor="middle" fill="#1e1e1e">EXECUTOR = an LLM</text><text x="185.0" y="240.6" font-size="16" text-anchor="middle" fill="#1e1e1e">reads the step + findings so far,</text><text x="185.0" y="260.6" font-size="16" text-anchor="middle" fill="#1e1e1e">decides: calculator(&#x27;120000+118500&#x27;)</text><rect x="400" y="190" width="370" height="90" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="220.6" font-size="16" text-anchor="middle" fill="#1e1e1e">WORKER = plain code</text><text x="585.0" y="240.6" font-size="16" text-anchor="middle" fill="#1e1e1e">swaps #E2 for its stored value,</text><text x="585.0" y="260.6" font-size="16" text-anchor="middle" fill="#1e1e1e">calls the tool. No thinking</text><polyline points="185,280 185,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polyline points="585,280 585,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="310" width="370" height="44" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="337.6" font-size="16" text-anchor="middle" fill="#1e1e1e">result: 238,500 (added to findings)</text><rect x="400" y="310" width="370" height="44" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="337.6" font-size="16" text-anchor="middle" fill="#1e1e1e">stored as #E4 = 238,500</text><polyline points="185,354 185,380" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polyline points="585,354 585,380" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="380" width="370" height="80" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="415.6" font-size="16" text-anchor="middle" fill="#1e1e1e">RE-PLANNER (LLM) sees results:</text><text x="185.0" y="435.6" font-size="16" text-anchor="middle" fill="#1e1e1e">can finish or change the plan</text><rect x="400" y="380" width="370" height="80" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="415.6" font-size="16" text-anchor="middle" fill="#1e1e1e">next line runs. No LLM looks at</text><text x="585.0" y="435.6" font-size="16" text-anchor="middle" fill="#1e1e1e">anything until the SOLVER</text><rect x="0" y="485" width="770" height="85" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="513.1" font-size="16" text-anchor="middle" fill="#1e1e1e">Both skip the planner between steps.</text><text x="385.0" y="533.1" font-size="16" text-anchor="middle" fill="#1e1e1e">P&amp;E: the executor THINKS through each step, and a re-planner can adapt.</text><text x="385.0" y="553.1" font-size="16" text-anchor="middle" fill="#1e1e1e">ReWOO: the worker only FILLS IN BLANKS the planner already wired up.</text></svg>