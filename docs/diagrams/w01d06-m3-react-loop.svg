lyline points="300,128 380,70" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#mef4444)"/><rect x="289.8" y="88.5" width="100.4" height="21.0" fill="#ffffff"/><text x="340.0" y="103.9" font-size="14" text-anchor="middle" fill="#ef4444">budget spent</text><polyline points="150,170 150,200" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="200" width="300" height="80" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="150.0" y="225.6" font-size="16" text-anchor="middle" fill="#1e1e1e">THINK</text><text x="150.0" y="245.6" font-size="16" text-anchor="middle" fill="#1e1e1e">msg = create(..., tools=SCHEMAS)</text><text x="150.0" y="265.6" font-size="16" text-anchor="middle" fill="#1e1e1e">messages.append(msg)</text><polyline points="150,280 150,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polygon points="150.0,310 260,365.0 150.0,420 40,365.0" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-width="2"/><text x="150.0" y="370.6" font-size="16" text-anchor="middle" fill="#1e1e1e">msg.tool_calls?</text><polyline points="150,420 150,460" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#m15803d)"/><rect x="138.3" y="429.5" width="23.400000000000002" height="21.0" fill="#ffffff"/><text x="150.0" y="444.9" font-size="14" text-anchor="middle" fill="#15803d">no</text><rect x="0" y="460" width="300" height="60" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="150.0" y="485.6" font-size="16" text-anchor="middle" fill="#1e1e1e">EXIT 1: the model answered</text><text x="150.0" y="505.6" font-size="16" text-anchor="middle" fill="#1e1e1e">return stopped = &quot;answer&quot;</text><polyline points="260,365 380,345" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#m2563eb)"/><rect x="304.45" y="344.5" width="31.1" height="21.0" fill="#ffffff"/><text x="320.0" y="359.9" font-size="14" text-anchor="middle" fill="#2563eb">yes</text><rect x="380" y="300" width="390" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="575.0" y="330.6" font-size="16" text-anchor="middle" fill="#1e1e1e">ACT: for call in msg.tool_calls:</text><text x="575.0" y="350.6" font-size="16" text-anchor="middle" fill="#1e1e1e">obs = TOOLS[name](**json.loads(args))</text><text x="575.0" y="370.6" font-size="16" text-anchor="middle" fill="#1e1e1e">on exception: obs = &quot;ERROR: ...&quot;</text><polyline points="575,390 575,420" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="380" y="420" width="390" height="70" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="575.0" y="450.6" font-size="16" text-anchor="middle" fill="#1e1e1e">OBSERVE: messages.append({&quot;role&quot;: &quot;tool&quot;,</text><text x="575.0" y="470.6" font-size="16" text-anchor="middle" fill="#1e1e1e">&quot;tool_call_id&quot;: call.id, &quot;content&quot;: obs})</text><polyline points="770,455 788,455 788,160 300,160" fill="none" stroke="#757575" stroke-width="2" marker-end="url(#m757575)"/><rect x="749.35" y="297.0" width="77.30000000000001" height="21.0" fill="#ffffff"/><text x="788.0" y="312.4" font-size="14" text-anchor="middle" fill="#757575">next step</text><rect x="0" y="535" width="770" height="45" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="563.1" font-size="16" text-anchor="middle" fill="#1e1e1e">Order matters: append msg first, then one tool message per call, matched by tool_call_id</text></svg>