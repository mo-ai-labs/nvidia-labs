<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 600" width="860" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="mb45309" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b45309"/></marker><marker id="m1e1e1e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="m15803d" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker></defs><rect x="-30" y="-30" width="860" height="600" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">Plan-and-execute: plan once, then run</text><rect x="0" y="50" width="220" height="50" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="80.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Q4: which alerts &gt; 200,000?</text><rect x="0" y="135" width="220" height="80" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="170.05" font-size="18" text-anchor="middle" fill="#1e1e1e">PLANNER</text><text x="110.0" y="192.55" font-size="18" text-anchor="middle" fill="#1e1e1e">big LLM, called once</text><polyline points="110,100 110,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="260" y="110" width="270" height="150" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="395.0" y="150.6" font-size="16" text-anchor="middle" fill="#1e1e1e">PLAN</text><text x="395.0" y="170.6" font-size="16" text-anchor="middle" fill="#1e1e1e">1. get A-1001, A-1002, A-1003</text><text x="395.0" y="190.6" font-size="16" text-anchor="middle" fill="#1e1e1e">2. sum each alert</text><text x="395.0" y="210.6" font-size="16" text-anchor="middle" fill="#1e1e1e">3. compare each sum</text><text x="395.0" y="230.6" font-size="16" text-anchor="middle" fill="#1e1e1e">    to 200,000</text><polyline points="220,175 260,175" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="570" y="110" width="200" height="150" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="670.0" y="160.6" font-size="16" text-anchor="middle" fill="#1e1e1e">EXECUTOR</text><text x="670.0" y="180.6" font-size="16" text-anchor="middle" fill="#1e1e1e">runs one step at a time</text><text x="670.0" y="200.6" font-size="16" text-anchor="middle" fill="#1e1e1e">(tools; can be a smaller</text><text x="670.0" y="220.6" font-size="16" text-anchor="middle" fill="#1e1e1e">model or a mini ReAct)</text><polyline points="530,185 570,185" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="570" y="300" width="200" height="80" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="670.0" y="325.6" font-size="16" text-anchor="middle" fill="#1e1e1e">RESULTS</text><text x="670.0" y="345.6" font-size="16" text-anchor="middle" fill="#1e1e1e">28,500 / 238,500</text><text x="670.0" y="365.6" font-size="16" text-anchor="middle" fill="#1e1e1e">/ 12,600</text><polyline points="670,260 670,300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polygon points="395.0,290 500,355.0 395.0,420 290,355.0" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-width="2"/><text x="395.0" y="350.6" font-size="16" text-anchor="middle" fill="#1e1e1e">RE-PLANNER</text><text x="395.0" y="370.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM: done?</text><polyline points="570,340 500,355" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><polyline points="395,290 395,260" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mb45309)"/><rect x="364.05" y="264.5" width="61.900000000000006" height="21.0" fill="#ffffff"/><text x="395.0" y="279.9" font-size="14" text-anchor="middle" fill="#b45309">re-plan</text><rect x="0" y="325" width="220" height="60" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="110.0" y="360.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Answer: only A-1002</text><polyline points="290,355 220,355" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#m15803d)"/><rect x="235.6" y="344.5" width="38.800000000000004" height="21.0" fill="#ffffff"/><text x="255.0" y="359.9" font-size="14" text-anchor="middle" fill="#15803d">done</text><rect x="0" y="450" width="770" height="90" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="480.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Big-model calls: planner + re-planner (+ executor calls if the executor is an LLM).</text><text x="385.0" y="500.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Wins: whole-task thinking, cheap executors, a plan a human can approve first.</text><text x="385.0" y="520.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Limit: steps still run one after another.</text></svg>