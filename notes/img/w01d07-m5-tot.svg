<text x="375" y="295" font-size="15" fill="#ef4444">pruned</text>
<text x="60" y="470" font-size="15" fill="#757575">Every box = the LLM proposing a thought. Every score = the LLM judging it.</text>
<text x="60" y="489" font-size="15" fill="#757575">So: many calls. Compares paths at EVERY step (self-consistency only at the end).</text>
<text x="60" y="508" font-size="15" fill="#757575">Game of 24: CoT 4% -&gt; ToT 74%. Pays off on search problems with dead ends.</text>
