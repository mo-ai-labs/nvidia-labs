<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -10 850 540" width="850" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-25" y="-10" width="850" height="540" fill="#ffffff"/><rect x="20" y="60" width="760" height="50" rx="12" stroke="#757575" stroke-width="2" fill="#e9ecef"/><rect x="40" y="170" width="220" height="40" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><rect x="40" y="220" width="220" height="40" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><rect x="40" y="270" width="220" height="40" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><rect x="40" y="320" width="220" height="40" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><polyline points="270.0,265.0 360.0,265.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="348.9,269.7 360.0,265.0 348.9,260.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="370" y="170" width="220" height="40" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><rect x="370" y="220" width="220" height="40" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><rect x="370" y="270" width="220" height="40" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><rect x="370" y="320" width="220" height="40" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><polyline points="600.0,265.0 650.0,265.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="638.9,269.7 650.0,265.0 638.9,260.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="655" y="230" width="130" height="70" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><rect x="40" y="400" width="720" height="110" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><text x="150.0" y="34.0" font-size="24" fill="#1e1e1e" text-anchor="start">Constrained decoding: masking the next token</text><text x="400.0" y="91.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Written so far:  {&quot;alert_id&quot;: &quot;A-1002&quot;, &quot;typology&quot;: &quot;high-risk wires&quot;, &quot;action&quot;: &quot;  ...next?</text><text x="40.0" y="150.0" font-size="20" fill="#1e1e1e" text-anchor="start">1. Model scores candidates</text><text x="150.0" y="196.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;file SAR&quot;  0.40</text><text x="150.0" y="246.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;enhanced due...&quot;  0.35</text><text x="150.0" y="296.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;escalate&quot;  0.20</text><text x="150.0" y="346.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;}&quot;  0.05</text><text x="330.0" y="150.0" font-size="20" fill="#1e1e1e" text-anchor="start">2. Schema masks illegal ones</text><text x="480.0" y="196.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;file SAR&quot;  BLOCKED</text><text x="480.0" y="246.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;enhanced due...&quot;  0.64</text><text x="480.0" y="296.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;escalate&quot;  0.36</text><text x="480.0" y="346.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;}&quot;  BLOCKED</text><text x="720.0" y="251.0" font-size="16" fill="#1e1e1e" text-anchor="middle">3. Sample</text><text x="720.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">from the</text><text x="720.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">legal ones</text><text x="400.0" y="431.0" font-size="16" fill="#1e1e1e" text-anchor="middle">&quot;file SAR&quot; isn&#x27;t in the action enum and &quot;}&quot; would end the object too early,</text><text x="400.0" y="451.0" font-size="16" fill="#1e1e1e" text-anchor="middle">so both get probability 0. The rest are renormalised (0.35/0.55 = 0.64).</text><text x="400.0" y="471.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Repeated for EVERY token: the output can&#x27;t leave the schema.</text><text x="400.0" y="491.0" font-size="16" fill="#1e1e1e" text-anchor="middle">But the model can still pick the WRONG legal value. (Numbers illustrative.)</text></svg>