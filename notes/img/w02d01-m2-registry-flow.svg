<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 887 498" width="887" height="498" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="-8" width="887" height="498" fill="#ffffff"/><rect x="20" y="90" width="200" height="120" rx="12" stroke="#4a9eed" stroke-width="2" fill="#a5d8ff"/><polyline points="220.0,150.0 280.0,150.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="268.9,154.7 280.0,150.0 268.9,145.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="300" y="90" width="200" height="120" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><polyline points="500.0,120.0 580.0,70.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="573.1,79.8 580.0,70.0 568.2,71.9" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="580" y="30" width="200" height="90" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><polyline points="500.0,180.0 580.0,230.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="568.2,228.1 580.0,230.0 573.1,220.2" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="580" y="190" width="200" height="90" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><polyline points="680.0,280.0 680.0,340.0" stroke="#22c55e" stroke-width="2" fill="none"/><polyline points="675.3,328.9 680.0,340.0 684.7,328.9" fill="none" stroke="#22c55e" stroke-width="2"/><rect x="580" y="340" width="200" height="70" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><polyline points="580.0,250.0 420.0,370.0" stroke="#ef4444" stroke-width="2" fill="none"/><polyline points="426.0,359.6 420.0,370.0 431.6,367.1" fill="none" stroke="#ef4444" stroke-width="2"/><rect x="220" y="340" width="200" height="70" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><text x="200.0" y="36.0" font-size="24" fill="#1e1e1e" text-anchor="start">registry.py: one function in, two jobs out</text><text x="120.0" y="136.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Your function</text><text x="120.0" y="156.0" font-size="16" fill="#1e1e1e" text-anchor="middle">name, type hints,</text><text x="120.0" y="176.0" font-size="16" fill="#1e1e1e" text-anchor="middle">docstring</text><text x="205.0" y="138.0" font-size="16" fill="#1e1e1e" text-anchor="start">register()</text><text x="400.0" y="136.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Pydantic model</text><text x="400.0" y="156.0" font-size="16" fill="#1e1e1e" text-anchor="middle">flag_alert_args</text><text x="400.0" y="176.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(fields + types)</text><text x="680.0" y="61.0" font-size="16" fill="#1e1e1e" text-anchor="middle">JOB 1: schemas()</text><text x="680.0" y="81.0" font-size="16" fill="#1e1e1e" text-anchor="middle">JSON schema the</text><text x="680.0" y="101.0" font-size="16" fill="#1e1e1e" text-anchor="middle">LLM reads</text><text x="680.0" y="221.0" font-size="16" fill="#1e1e1e" text-anchor="middle">JOB 2: call()</text><text x="680.0" y="241.0" font-size="16" fill="#1e1e1e" text-anchor="middle">validates the args</text><text x="680.0" y="261.0" font-size="16" fill="#1e1e1e" text-anchor="middle">the LLM wrote</text><text x="690.0" y="314.0" font-size="16" fill="#1e1e1e" text-anchor="start">valid</text><text x="680.0" y="381.0" font-size="16" fill="#1e1e1e" text-anchor="middle">fn(**args) runs</text><text x="460.0" y="306.0" font-size="16" fill="#ef4444" text-anchor="start">invalid</text><text x="320.0" y="371.0" font-size="16" fill="#1e1e1e" text-anchor="middle">ValidationError</text><text x="320.0" y="391.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(tool never runs)</text><text x="40.0" y="466.0" font-size="16" fill="#757575" text-anchor="start">The docstring skips the model: schemas() reads it straight from the function as &quot;description&quot;.</text></svg>