<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Segoe UI, sans-serif"><rect width="800" height="600" fill="#fff"/>
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#555"/></marker></defs>
<text x="400.0" y="40" font-size="22" text-anchor="middle" font-weight="600">How the paper gets CoT: worked examples in the prompt</text>
<rect x="40" y="70" width="460" height="470" rx="10" fill="#eef2ff" stroke="#4a9eed" stroke-width="2"/>
<rect x="60" y="115" width="420" height="110" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="270.0" y="145.0" font-size="15" text-anchor="middle">Example 1</text>
<text x="270.0" y="165.0" font-size="15" text-anchor="middle">Q: 4 wires of $2.4k to new payees in 1 day?</text>
<text x="270.0" y="185.0" font-size="15" text-anchor="middle">A: Each small. Total $9.6k. New payees, same day</text>
<text x="270.0" y="205.0" font-size="15" text-anchor="middle">-&gt; fan-out pattern. Answer: review</text>
<rect x="60" y="245" width="420" height="110" rx="10" fill="#fff3bf" stroke="#f59e0b" stroke-width="2"/>
<text x="270.0" y="275.0" font-size="15" text-anchor="middle">Example 2</text>
<text x="270.0" y="295.0" font-size="15" text-anchor="middle">Q: Monthly payroll, same 40 employees?</text>
<text x="270.0" y="315.0" font-size="15" text-anchor="middle">A: Recurring. Known payees. Matches history</text>
<text x="270.0" y="335.0" font-size="15" text-anchor="middle">-&gt; expected. Answer: close</text>
<rect x="60" y="385" width="420" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="270.0" y="415.0" font-size="15" text-anchor="middle">New Q: 3 cash deposits of $4,900 in 2 days?</text>
<text x="270.0" y="435.0" font-size="15" text-anchor="middle">A:</text>
<rect x="570" y="240" width="200" height="120" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="670.0" y="285.0" font-size="15" text-anchor="middle">Copies the shape:</text>
<text x="670.0" y="305.0" font-size="15" text-anchor="middle">steps first,</text>
<text x="670.0" y="325.0" font-size="15" text-anchor="middle">then &#x27;Answer:&#x27;</text>
<polyline points="500,300 566,300" fill="none" stroke="#555" stroke-width="2"  marker-end="url(#h)"/>
<text x="533.0" y="292.0" font-size="14" text-anchor="middle" fill="#555">model</text>
<text x="60" y="95" font-size="16" fill="#2563eb">ONE prompt</text>
<text x="60" y="480" font-size="15" fill="#b45309">yellow = &#x27;chain of thought demonstrations</text>
<text x="60" y="499" font-size="15" fill="#b45309">provided as exemplars&#x27;</text>
<text x="520" y="420" font-size="14" fill="#757575">Few-shot CoT = examples (Wei et al.)</text>
<text x="520" y="438" font-size="14" fill="#757575">Zero-shot CoT = &#x27;Let&#x27;s think step by step&#x27;</text>
<text x="520" y="456" font-size="14" fill="#757575">(Kojima et al., 2205.11916)</text>
</svg>