ke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="810.7,202.5 820.0,195.0 808.1,193.5" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="750.0,215.0 820.0,265.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="808.3,262.4 820.0,265.0 813.7,254.8" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="20" y="410" width="520" height="130" rx="12" stroke="#e03131" stroke-width="2" fill="#ffffff"/><rect x="580" y="410" width="560" height="130" rx="12" stroke="#1971c2" stroke-width="2" fill="#ffffff"/><text x="20.0" y="20.0" font-size="20" fill="#1e1e1e" text-anchor="start">Your agent, two OWASP risks: how the attacker gets IN vs. how far the damage goes</text><text x="280.0" y="221.0" font-size="16" fill="#1e1e1e" text-anchor="middle"></text><text x="40.0" y="78.0" font-size="18" fill="#e03131" text-anchor="start">LLM01 Prompt Injection = the WAY IN</text><text x="145.0" y="141.0" font-size="16" fill="#1e1e1e" text-anchor="middle">User: &quot;Review alert A-1001&quot;</text><text x="145.0" y="161.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(direct channel)</text><text x="140.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Policy store</text><text x="140.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">POL-99 = poisoned text</text><text x="140.0" y="311.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(indirect channel)</text><text x="415.0" y="201.0" font-size="16" fill="#1e1e1e" text-anchor="middle">LLM context</text><text x="415.0" y="221.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(instructions + data</text><text x="415.0" y="241.0" font-size="16" fill="#1e1e1e" text-anchor="middle">all look the same)</text><text x="250.0" y="313.0" font-size="13" fill="#e03131" text-anchor="start">via search_policy</text><text x="860.0" y="221.0" font-size="16" fill="#1e1e1e" text-anchor="middle"></text><text x="600.0" y="78.0" font-size="18" fill="#1971c2" text-anchor="start">LLM06 Excessive Agency = the BLAST RADIUS</text><text x="675.0" y="211.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Model picks</text><text x="675.0" y="231.0" font-size="16" fill="#1e1e1e" text-anchor="middle">a tool call</text><text x="965.0" y="130.2" font-size="14" fill="#1e1e1e" text-anchor="middle">get_alert / search_policy / calculator</text><text x="965.0" y="200.2" font-size="14" fill="#1e1e1e" text-anchor="middle">flag_alert  (side effect!)</text><text x="965.0" y="270.2" font-size="14" fill="#1e1e1e" text-anchor="middle">run_python  (open-ended!)</text><text x="600.0" y="324.0" font-size="14" fill="#1971c2" text-anchor="start">3 root causes: excessive FUNCTIONALITY,</text><text x="600.0" y="341.5" font-size="14" fill="#1971c2" text-anchor="start">excessive PERMISSIONS, excessive AUTONOMY</text><text x="280.0" y="454.0" font-size="14" fill="#1e1e1e" text-anchor="middle">LLM01 mitigations</text><text x="280.0" y="471.5" font-size="14" fill="#1e1e1e" text-anchor="middle">constrain behaviour · validate output format · filter in/out</text><text x="280.0" y="489.0" font-size="14" fill="#1e1e1e" text-anchor="middle">SEGREGATE external content · least privilege</text><text x="280.0" y="506.5" font-size="14" fill="#1e1e1e" text-anchor="middle">human approval for high-risk · adversarial testing</text><text x="860.0" y="454.0" font-size="14" fill="#1e1e1e" text-anchor="middle">LLM06 mitigations</text><text x="860.0" y="471.5" font-size="14" fill="#1e1e1e" text-anchor="middle">minimize extensions · minimize their functionality</text><text x="860.0" y="489.0" font-size="14" fill="#1e1e1e" text-anchor="middle">avoid open-ended tools (run_python!) · minimize permissions</text><text x="860.0" y="506.5" font-size="14" fill="#1e1e1e" text-anchor="middle">run in the USER&#x27;s context · human approval for high impact</text><text x="20.0" y="574.0" font-size="14" fill="#2f9e44" text-anchor="start">Today&#x27;s code: secure_call = LLM06 (user role decides)  ·  sandbox = limits run_python  ·  injection_test = LLM01 adversarial testing</text></svg>