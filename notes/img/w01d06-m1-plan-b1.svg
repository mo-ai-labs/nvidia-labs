<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 590" width="860" height="590" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m1e1e1e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker></defs><rect x="-30" y="-30" width="860" height="590" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">ReAct&#x27;s two costs, on Q4</text><text x="0" y="50" font-size="16" fill="#757575" font-weight="600">Q4: which of A-1001, A-1002, A-1003 total above 200,000?</text><rect x="0" y="70" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 1</text><rect x="200" y="70" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="95.6" font-size="16" text-anchor="middle" fill="#1e1e1e">get_alert(A-1001)</text><polyline points="150,90 200,90" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="120" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="145.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 2</text><rect x="200" y="120" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="145.6" font-size="16" text-anchor="middle" fill="#1e1e1e">calculator(A-1001 sum)</text><polyline points="150,140 200,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="170" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="195.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 3</text><rect x="200" y="170" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="195.6" font-size="16" text-anchor="middle" fill="#1e1e1e">get_alert(A-1002)</text><polyline points="150,190 200,190" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="220" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="245.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 4</text><rect x="200" y="220" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="245.6" font-size="16" text-anchor="middle" fill="#1e1e1e">calculator(A-1002 sum)</text><polyline points="150,240 200,240" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="270" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 5</text><rect x="200" y="270" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">get_alert(A-1003)</text><polyline points="150,290 200,290" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="320" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="345.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 6</text><rect x="200" y="320" width="260" height="40" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="345.6" font-size="16" text-anchor="middle" fill="#1e1e1e">calculator(A-1003 sum)</text><polyline points="150,340 200,340" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="370" width="150" height="40" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="75.0" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 7</text><rect x="200" y="370" width="260" height="40" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="330.0" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">answer: only A-1002</text><polyline points="150,390 200,390" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="500" y="70" width="270" height="140" rx="12" fill="#ffc9c9" fill-opacity="1.0" stroke="#ef4444" stroke-opacity="1.0" stroke-width="2"/><text x="635.0" y="115.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Cost 1: one LLM call</text><text x="635.0" y="135.6" font-size="16" text-anchor="middle" fill="#1e1e1e">per tool call</text><text x="635.0" y="155.6" font-size="16" text-anchor="middle" fill="#1e1e1e">7 big-model calls</text><text x="635.0" y="175.6" font-size="16" text-anchor="middle" fill="#1e1e1e">for 6 small tool calls</text><rect x="500" y="230" width="270" height="180" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="635.0" y="285.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Cost 2: plans one</text><text x="635.0" y="305.6" font-size="16" text-anchor="middle" fill="#1e1e1e">sub-problem at a time</text><text x="635.0" y="325.6" font-size="16" text-anchor="middle" fill="#1e1e1e">It never stepped back to say</text><text x="635.0" y="345.6" font-size="16" text-anchor="middle" fill="#1e1e1e">&quot;fetch all 3, then sum&quot;:</text><text x="635.0" y="365.6" font-size="16" text-anchor="middle" fill="#1e1e1e">no view of the whole task</text><rect x="0" y="440" width="770" height="90" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="470.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Plan-and-execute&#x27;s answer: think through the WHOLE task once (planner),</text><text x="385.0" y="490.6" font-size="16" text-anchor="middle" fill="#1e1e1e">then run the steps without asking the big model each time.</text><text x="385.0" y="510.6" font-size="16" text-anchor="middle" fill="#1e1e1e">(Modern APIs can also return several tool_calls in one message.)</text></svg>