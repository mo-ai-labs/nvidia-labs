="600" width="120" height="55" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2" /><text x="470.0" y="623.3" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="400">MAX_STEPS</text><text x="470.0" y="637.3" font-size="14" text-anchor="middle" fill="#1e1e1e" font-weight="400">stop</text><polyline points="280,560 280,628 410,628" fill="none" stroke="#e03131" stroke-width="2"  marker-end="url(#ahe03131)"/><text x="290" y="612.35" font-size="13" text-anchor="start" fill="#e03131" font-weight="400">budget spent</text><text x="280.0" y="667.35" font-size="13" text-anchor="middle" fill="#495057" font-weight="400">Exit #1 answer · Exit #2 MAX_STEPS · failure mode: repeats thoughts/actions</text><rect x="800" y="135" width="180" height="45" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2" /><text x="890.0" y="162.7" font-size="16" text-anchor="middle" fill="#1e1e1e" font-weight="400">Question</text><rect x="760" y="210" width="260" height="60" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" /><text x="890.0" y="235.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">PLANNER (1 LLM call)</text><text x="890.0" y="250.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">JSON: goal · steps · risks</text><polygon points="890.0,300 990,340.0 890.0,380 790,340.0" fill="#ffec99" stroke="#e67700" stroke-width="2"/><text x="890.0" y="335.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">check()</text><text x="890.0" y="350.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">auto gate</text><polygon points="890.0,410 990,450.0 890.0,490 790,450.0" fill="#ffec99" stroke="#e67700" stroke-width="2"/><text x="890.0" y="445.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">input()</text><text x="890.0" y="460.5" font-size="15" text-anchor="middle" fill="#1e1e1e" font-weight="400">human gate</text><rect x="760" y="525" width="260" height="70" rx="10" fil