anchor="middle" fill="#1e1e1e" font-weight="400">Rejected:</text><text x="1127.5" y="459.1" font-size="13" text-anchor="middle" fill="#1e1e1e" font-weight="400">nothing executed</text><polyline points="990,450 1060,450" fill="none" stroke="#e03131" stroke-width="2"  marker-end="url(#ahe03131)"/><text x="1020" y="440.35" font-size="13" text-anchor="start" fill="#e03131" font-weight="400">n</text><text x="590" y="452.35" font-size="13" text-anchor="start" fill="#e67700" font-weight="400">Gate sits BETWEEN</text><text x="590" y="465.35" font-size="13" text-anchor="start" fill="#e67700" font-weight="400">planning and acting →</text><text x="590" y="478.35" font-size="13" text-anchor="start" fill="#e67700" font-weight="400">human judges intent</text><text x="590" y="491.35" font-size="13" text-anchor="start" fill="#e67700" font-weight="400">before any tool runs</text><text x="1030" y="552.35" font-size="13" text-anchor="start" fill="#495057" font-weight="400">Day 12: LangGraph</text><text x="1030" y="565.35" font-size="13" text-anchor="start" fill="#495057" font-weight="400">interrupt() +</text><text x="1030" y="578.35" font-size="13" text-anchor="start" fill="#495057" font-weight="400">checkpointer</text><text x="590" y="672.35" font-size="13" text-anchor="start" fill="#495057" font-weight="400">calls ≈ 1 + Σ steps + 1</text></svg>