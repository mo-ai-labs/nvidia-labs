<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 0 960 464" width="960" height="464" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="20" y="0" width="960" height="464" fill="#ffffff"/><rect x="40" y="90" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><rect x="40" y="160" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><rect x="40" y="230" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#b2f2bb"/><rect x="420" y="160" width="230" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#a5d8ff"/><polyline points="320.0,115.0 420.0,175.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="408.1,173.3 420.0,175.0 412.9,165.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="320.0,185.0 420.0,185.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="408.9,189.7 420.0,185.0 408.9,180.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="320.0,255.0 420.0,195.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="412.9,204.7 420.0,195.0 408.1,196.7" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="740" y="160" width="220" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d0bfff"/><polyline points="650.0,185.0 740.0,185.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="728.9,189.7 740.0,185.0 728.9,180.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="40" y="350" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" stroke-dasharray="8 6"/><rect x="340" y="350" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" stroke-dasharray="8 6"/><rect x="640" y="350" width="280" height="50" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#ffec99" stroke-dasharray="8 6"/><text x="40.0" y="40.0" font-size="20" fill="#1e1e1e" text-anchor="start">One agent version = everything that changes behaviour, pinned together</text><text x="40.0" y="76.0" font-size="16" fill="#2b8a3e" text-anchor="start">In today&#x27;s hash</text><text x="180.0" y="121.0" font-size="16" fill="#1e1e1e" text-anchor="middle">System prompt (agent.py)</text><text x="180.0" y="191.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Tool schemas (registry.py)</text><text x="180.0" y="261.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Model (AGENT_MODEL / default)</text><text x="535.0" y="191.0" font-size="16" fill="#1e1e1e" text-anchor="middle">version() = sha256[:12]</text><text x="850.0" y="191.0" font-size="16" fill="#1e1e1e" text-anchor="middle">report-&lt;version&gt;.json</text><text x="40.0" y="336.0" font-size="16" fill="#e67700" text-anchor="start">In git, but NOT in the hash: change these and the id stays the same</text><text x="180.0" y="381.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Sampling: temperature, top_p</text><text x="480.0" y="381.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Retrieval: policies in data.py</text><text x="780.0" y="381.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Guardrails: roles, secure_call</text><text x="40.0" y="440.0" font-size="15" fill="#c92a2a" text-anchor="start">Caveat: .env can override AGENT_MODEL, and a hosted model name is not frozen weights</text></svg>