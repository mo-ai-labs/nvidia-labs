<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -6 804 456" width="804" height="456" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-4" y="-6" width="804" height="456" fill="#ffffff"/><rect x="20" y="80" width="160" height="110" rx="12" stroke="#4a9eed" stroke-width="2" fill="#a5d8ff"/><polyline points="180.0,135.0 220.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="208.9,139.7 220.0,135.0 208.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="100.0,190.0 100.0,240.0" stroke="#ef4444" stroke-width="2" fill="none"/><polyline points="95.3,228.9 100.0,240.0 104.7,228.9" fill="none" stroke="#ef4444" stroke-width="2"/><rect x="20" y="240" width="160" height="90" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><rect x="220" y="80" width="160" height="110" rx="12" stroke="#8b5cf6" stroke-width="2" fill="#d0bfff"/><polyline points="380.0,135.0 420.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="408.9,139.7 420.0,135.0 408.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="300.0,190.0 300.0,240.0" stroke="#ef4444" stroke-width="2" fill="none"/><polyline points="295.3,228.9 300.0,240.0 304.7,228.9" fill="none" stroke="#ef4444" stroke-width="2"/><rect x="220" y="240" width="160" height="90" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><rect x="420" y="80" width="160" height="110" rx="12" stroke="#f59e0b" stroke-width="2" fill="#fff3bf"/><polyline points="580.0,135.0 620.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="608.9,139.7 620.0,135.0 608.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><polyline points="500.0,190.0 500.0,240.0" stroke="#ef4444" stroke-width="2" fill="none"/><polyline points="495.3,228.9 500.0,240.0 504.7,228.9" fill="none" stroke="#ef4444" stroke-width="2"/><rect x="420" y="240" width="160" height="90" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><rect x="620" y="80" width="160" height="110" rx="12" stroke="#22c55e" stroke-width="2" fill="#b2f2bb"/><polyline points="700.0,190.0 700.0,240.0" stroke="#ef4444" stroke-width="2" fill="none"/><polyline points="695.3,228.9 700.0,240.0 704.7,228.9" fill="none" stroke="#ef4444" stroke-width="2"/><rect x="620" y="240" width="160" height="90" rx="12" stroke="#ef4444" stroke-width="2" fill="#ffc9c9"/><polyline points="780.0,400.0 20.0,400.0" stroke="#757575" stroke-width="2" fill="none" stroke-dasharray="8 6"/><polyline points="31.1,395.3 20.0,400.0 31.1,404.7" fill="none" stroke="#757575" stroke-width="2"/><text x="150.0" y="38.0" font-size="24" fill="#1e1e1e" text-anchor="start">One tool call, four places it can go wrong</text><text x="100.0" y="111.0" font-size="16" fill="#1e1e1e" text-anchor="middle">1. Model reads</text><text x="100.0" y="131.0" font-size="16" fill="#1e1e1e" text-anchor="middle">the tool list</text><text x="100.0" y="151.0" font-size="16" fill="#1e1e1e" text-anchor="middle">(name, description,</text><text x="100.0" y="171.0" font-size="16" fill="#1e1e1e" text-anchor="middle">schema)</text><text x="100.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Picks the wrong</text><text x="100.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">tool, or skips</text><text x="100.0" y="311.0" font-size="16" fill="#1e1e1e" text-anchor="middle">one it needed</text><text x="300.0" y="121.0" font-size="16" fill="#1e1e1e" text-anchor="middle">2. Model writes</text><text x="300.0" y="141.0" font-size="16" fill="#1e1e1e" text-anchor="middle">a call: tool name</text><text x="300.0" y="161.0" font-size="16" fill="#1e1e1e" text-anchor="middle">+ JSON arguments</text><text x="300.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">Invents or</text><text x="300.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">mistypes an</text><text x="300.0" y="311.0" font-size="16" fill="#1e1e1e" text-anchor="middle">argument</text><text x="500.0" y="121.0" font-size="16" fill="#1e1e1e" text-anchor="middle">3. Your code</text><text x="500.0" y="141.0" font-size="16" fill="#1e1e1e" text-anchor="middle">checks the</text><text x="500.0" y="161.0" font-size="16" fill="#1e1e1e" text-anchor="middle">arguments</text><text x="500.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">A bad value</text><text x="500.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">is NOT caught</text><text x="500.0" y="311.0" font-size="16" fill="#1e1e1e" text-anchor="middle">here</text><text x="700.0" y="121.0" font-size="16" fill="#1e1e1e" text-anchor="middle">4. The tool</text><text x="700.0" y="141.0" font-size="16" fill="#1e1e1e" text-anchor="middle">runs (maybe</text><text x="700.0" y="161.0" font-size="16" fill="#1e1e1e" text-anchor="middle">changes state)</text><text x="700.0" y="271.0" font-size="16" fill="#1e1e1e" text-anchor="middle">A timeout makes</text><text x="700.0" y="291.0" font-size="16" fill="#1e1e1e" text-anchor="middle">the model retry:</text><text x="700.0" y="311.0" font-size="16" fill="#1e1e1e" text-anchor="middle">runs twice</text><text x="150.0" y="426.0" font-size="16" fill="#757575" text-anchor="start">result (or error text) goes back to the model as a message</text></svg>