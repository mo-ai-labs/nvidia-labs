ze="16" text-anchor="middle" fill="#1e1e1e">= a mini ReAct loop, calls += its steps</text><polyline points="190,480 190,505" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="505" width="380" height="70" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="190.0" y="535.6" font-size="16" text-anchor="middle" fill="#1e1e1e">final LLM call: answer in 2 lines,</text><text x="190.0" y="555.6" font-size="16" text-anchor="middle" fill="#1e1e1e">&quot;say so if the data doesn&#x27;t contain it&quot;</text><rect x="420" y="390" width="350" height="185" rx="12" fill="#f1f3f5" fill-opacity="1.0" stroke="#757575" stroke-opacity="1.0" stroke-width="2"/><text x="595.0" y="438.1" font-size="16" text-anchor="middle" fill="#1e1e1e">llm_calls = 1 (planner)</text><text x="595.0" y="458.1" font-size="16" text-anchor="middle" fill="#1e1e1e">+ sum of each step&#x27;s ReAct steps</text><text x="595.0" y="478.1" font-size="16" text-anchor="middle" fill="#1e1e1e">+ 1 (final answer)</text><text x="595.0" y="498.1" font-size="16" text-anchor="middle" fill="#1e1e1e"></text><text x="595.0" y="518.1" font-size="16" text-anchor="middle" fill="#1e1e1e">No re-planner here:</text><text x="595.0" y="538.1" font-size="16" text-anchor="middle" fill="#1e1e1e">that&#x27;s the sq-replan side quest</text></svg>