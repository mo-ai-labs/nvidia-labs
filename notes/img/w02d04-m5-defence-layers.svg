<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1305 320" width="1305" height="320" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="-20" y="-20" width="1305" height="320" fill="#ffffff"/><rect x="20" y="80" width="225" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" stroke-dasharray="8 6"/><polyline points="245.0,135.0 275.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="263.9,139.7 275.0,135.0 263.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="275" y="80" width="225" height="110" rx="12" stroke="#e03131" stroke-width="2" fill="#ffe3e3"/><polyline points="500.0,135.0 530.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="518.9,139.7 530.0,135.0 518.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="530" y="80" width="225" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8"/><polyline points="755.0,135.0 785.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="773.9,139.7 785.0,135.0 773.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="785" y="80" width="225" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" stroke-dasharray="8 6"/><polyline points="1010.0,135.0 1040.0,135.0" stroke="#1e1e1e" stroke-width="2" fill="none"/><polyline points="1028.9,139.7 1040.0,135.0 1028.9,130.3" fill="none" stroke="#1e1e1e" stroke-width="2"/><rect x="1040" y="80" width="225" height="110" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#fff3bf" stroke-dasharray="8 6"/><rect x="20" y="220" width="430" height="60" rx="12" stroke="#1e1e1e" stroke-width="2" fill="#d3f9d8"/><rect x="480" y="220" width="755" height="60" rx="12" stroke="#e03131" stroke-width="2" fill="#fff5f5"/><text x="20.0" y="20.0" font-size="20" fill="#1e1e1e" text-anchor="start">Defence in depth: each layer assumes the one before it already failed</text><text x="20.0" y="48.0" font-size="14" fill="#555555" text-anchor="start">green = built today   ·   yellow dashed = coming   ·   red = where POL-99 got through</text><text x="132.5" y="122.8" font-size="14" fill="#1e1e1e" text-anchor="middle">1 · Input filter</text><text x="132.5" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">retrieval rails on POL-99</text><text x="132.5" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">(Day 21)</text><text x="387.5" y="122.8" font-size="14" fill="#1e1e1e" text-anchor="middle">2 · Policy prompt</text><text x="387.5" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">system: &#x27;never guess&#x27;</text><text x="387.5" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">(talked out of it: investigator run)</text><text x="642.5" y="122.8" font-size="14" fill="#1e1e1e" text-anchor="middle">3 · Constrained tools</text><text x="642.5" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">secure_call role check</text><text x="642.5" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">+ run_python sandbox</text><text x="897.5" y="122.8" font-size="14" fill="#1e1e1e" text-anchor="middle">4 · Output filter</text><text x="897.5" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">flag &#x27;pre-cleared /</text><text x="897.5" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">false positive&#x27; answers (Day 21)</text><text x="1152.5" y="122.8" font-size="14" fill="#1e1e1e" text-anchor="middle">5 · Human escalation</text><text x="1152.5" y="140.2" font-size="14" fill="#1e1e1e" text-anchor="middle">approval before</text><text x="1152.5" y="157.8" font-size="14" fill="#1e1e1e" text-anchor="middle">flag_alert (Day 9)</text><text x="235.0" y="246.5" font-size="14" fill="#1e1e1e" text-anchor="middle">Audit chain (built today): records every call, catches edits.</text><text x="235.0" y="264.0" font-size="14" fill="#1e1e1e" text-anchor="middle">Records, never blocks.</text><text x="857.5" y="246.5" font-size="14" fill="#1e1e1e" text-anchor="middle">Investigator run: POL-99 passed layers 1–2, layer 3 allowed it (role has flag_alert),</text><text x="857.5" y="264.0" font-size="14" fill="#1e1e1e" text-anchor="middle">only the model&#x27;s own choice kept the tool from running. The answer leaked through.</text></svg>