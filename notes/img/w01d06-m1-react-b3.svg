<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 885 600" width="885" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="mef4444" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ef4444"/></marker></defs><rect x="-30" y="-30" width="885" height="600" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">Same question, two different ways to fail</text><text x="0" y="52" font-size="16" fill="#757575" font-weight="600">Q5: How much cash did Northwind deposit last year?  (the data only has a 7-day alert)</text><text x="0" y="86" font-size="18" fill="#b45309" font-weight="600">Chain-of-thought: thinks, never checks</text><rect x="0" y="100" width="370" height="48" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="129.6" font-size="16" text-anchor="middle" fill="#1e1e1e">THINK: Northwind is a trading firm...</text><rect x="0" y="160" width="370" height="48" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="189.6" font-size="16" text-anchor="middle" fill="#1e1e1e">THINK: firms like that deposit ~1M a year</text><rect x="0" y="220" width="370" height="48" rx="12" fill="#ffc9c9" fill-opacity="1.0" stroke="#ef4444" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="250.3" font-size="18" text-anchor="middle" fill="#1e1e1e">ANSWER: &quot;About $1.2M&quot;</text><rect x="0" y="300" width="370" height="110" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="185.0" y="340.6" font-size="16" text-anchor="middle" fill="#1e1e1e">HALLUCINATION</text><text x="185.0" y="360.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Fluent and confident, but invented:</text><text x="185.0" y="380.6" font-size="16" text-anchor="middle" fill="#1e1e1e">no step ever looked anything up</text><text x="400" y="86" font-size="18" fill="#b91c1c" font-weight="600">ReAct: checks, but gets stuck</text><rect x="400" y="100" width="370" height="48" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="129.6" font-size="16" text-anchor="middle" fill="#1e1e1e">ACT: get_alert(&#x27;A-1001&#x27;)</text><rect x="400" y="160" width="370" height="48" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="189.6" font-size="16" text-anchor="middle" fill="#1e1e1e">OBS: 3 deposits, 7-day window</text><rect x="400" y="220" width="370" height="48" rx="12" fill="#d0bfff" fill-opacity="1.0" stroke="#8b5cf6" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="249.6" font-size="16" text-anchor="middle" fill="#1e1e1e">THINK: need last year... check the alert again</text><polyline points="770,244 795,244 795,124 770,124" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#mef4444)"/><rect x="771.75" y="173.5" width="46.5" height="21.0" fill="#ffffff"/><text x="795.0" y="188.9" font-size="14" text-anchor="middle" fill="#ef4444">again</text><rect x="400" y="300" width="370" height="110" rx="12" fill="#ffc9c9" fill-opacity="1.0" stroke="#ef4444" stroke-opacity="1.0" stroke-width="2"/><text x="585.0" y="340.6" font-size="16" text-anchor="middle" fill="#1e1e1e">REASONING ERROR</text><text x="585.0" y="360.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Facts are real, but it picks the wrong</text><text x="585.0" y="380.6" font-size="16" text-anchor="middle" fill="#1e1e1e">next step: same thought, same call, repeat</text><rect x="0" y="440" width="770" height="100" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="475.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Right answer: &quot;The data only covers a 7-day window, so I can&#x27;t tell.&quot;</text><text x="385.0" y="495.6" font-size="16" text-anchor="middle" fill="#1e1e1e">CoT fix = ground it in tools.  ReAct fix = MAX_STEPS stops the loop.</text><text x="385.0" y="515.6" font-size="16" text-anchor="middle" fill="#1e1e1e">This is exactly what Q5 and Bet C test in Mission 5.</text></svg>