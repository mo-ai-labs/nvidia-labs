<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 860 610" width="860" height="610" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="m1e1e1e" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker></defs><rect x="-30" y="-30" width="860" height="610" fill="#ffffff"/><text x="0" y="24" font-size="24" fill="#1e1e1e" font-weight="600">ReWOO: a plan with variables, no LLM between steps</text><rect x="0" y="70" width="200" height="100" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="100.0" y="105.6" font-size="16" text-anchor="middle" fill="#1e1e1e">PLANNER</text><text x="100.0" y="125.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 1</text><text x="100.0" y="145.6" font-size="16" text-anchor="middle" fill="#1e1e1e">never sees results</text><rect x="240" y="50" width="530" height="150" rx="12" fill="#fff3bf" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="100.6" font-size="16" text-anchor="middle" fill="#1e1e1e">#E1 = get_alert[A-1001]</text><text x="505.0" y="120.6" font-size="16" text-anchor="middle" fill="#1e1e1e">#E2 = get_alert[A-1002]</text><text x="505.0" y="140.6" font-size="16" text-anchor="middle" fill="#1e1e1e">#E3 = get_alert[A-1003]</text><text x="505.0" y="160.6" font-size="16" text-anchor="middle" fill="#1e1e1e">#E4 = calculator[amounts in #E1, #E2, #E3]</text><polyline points="200,120 240,120" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="240" y="235" width="530" height="90" rx="12" fill="#b2f2bb" fill-opacity="1.0" stroke="#22c55e" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="275.6" font-size="16" text-anchor="middle" fill="#1e1e1e">WORKER: runs each line in order and pastes earlier</text><text x="505.0" y="295.6" font-size="16" text-anchor="middle" fill="#1e1e1e">results into the #E slots. Plain code + tools, NO LLM</text><polyline points="505,200 505,235" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="240" y="360" width="530" height="60" rx="12" fill="#c3fae8" fill-opacity="1.0" stroke="#0f766e" stroke-opacity="1.0" stroke-width="2"/><text x="505.0" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">EVIDENCE: #E1..#E3 = alerts, #E4 = 28,500 / 238,500 / 12,600</text><polyline points="505,325 505,360" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="345" width="200" height="90" rx="12" fill="#a5d8ff" fill-opacity="1.0" stroke="#4a9eed" stroke-opacity="1.0" stroke-width="2"/><text x="100.0" y="375.6" font-size="16" text-anchor="middle" fill="#1e1e1e">SOLVER</text><text x="100.0" y="395.6" font-size="16" text-anchor="middle" fill="#1e1e1e">LLM call 2</text><text x="100.0" y="415.6" font-size="16" text-anchor="middle" fill="#1e1e1e">writes the answer</text><polyline points="240,390 200,390" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#m1e1e1e)"/><rect x="0" y="460" width="770" height="90" rx="12" fill="#ffd8a8" fill-opacity="1.0" stroke="#f59e0b" stroke-opacity="1.0" stroke-width="2"/><text x="385.0" y="490.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Just 2 LLM calls, and each step gets only its own inputs, not the whole history.</text><text x="385.0" y="510.6" font-size="16" text-anchor="middle" fill="#1e1e1e">Catch: the plan is fixed up front. If #E2 fails or surprises,</text><text x="385.0" y="530.6" font-size="16" text-anchor="middle" fill="#1e1e1e">nothing adapts (no observations reach the planner).</text></svg>