# One agent codebase: `app/` is installed (editable) by `uv sync`, so `from app.tools.registry import registry`
# works from any folder, and `uv run python x.py` inside app/<module>/ keeps working.
[project]
name = "nvidia-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "openai>=1.54",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
