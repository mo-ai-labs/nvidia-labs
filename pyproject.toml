# Shared deps for the plain-script labs: `uv run python x.py` from any folder below uses these.
# Labs with their own pyproject.toml (05-nim/quickstart-fastapi, 01-cuda/matmul-bench) keep theirs.
[project]
name = "nvidia-labs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.54",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.uv]
package = false
